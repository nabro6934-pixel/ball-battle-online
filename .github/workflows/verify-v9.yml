name: Verify V9 Gameplay
on:
  push:
    branches: [v9-new-fighters-clans-royale]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check server.js
      - run: node --check engine.js
      - run: node --check royale.js
      - run: node tests/profile_recovery.test.cjs
      - run: node tests/v9.test.cjs

name: Verify v9 feature suite
on:
  push:
    branches: [v9-clans-royale-21-heroes]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check engine.js && node --check royale.js && node --check server.js
      - run: node tests/v9-smoke.test.cjs
      - run: node tests/v9-sprites.test.cjs
      - run: node tests/v9-community.test.cjs
